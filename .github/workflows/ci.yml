name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Testes e TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Validar tipos
        run: npm run typecheck

      - name: Executar testes
        run: npm test

  docker:
    name: Build Docker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: validate

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Construir imagem
        run: docker build --tag bimer-integration-api:${{ github.sha }} .

  deploy:
    name: Deploy em produção
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on:
      - self-hosted
      - linux
      - x64
    timeout-minutes: 15
    needs: docker
    environment: production

    steps:
      - name: Baixar o código aprovado
        uses: actions/checkout@v4

      - name: Carregar configuração de produção
        run: |
          test -r /home/moises/bimer-api-production/.env
          ln -sfn /home/moises/bimer-api-production/.env .env

      - name: Construir e atualizar produção
        run: |
          docker compose --project-name bimer-api build --pull
          docker compose --project-name bimer-api up -d --remove-orphans

      - name: Validar saúde da aplicação
        run: |
          for attempt in {1..12}; do
            if curl -fsS http://127.0.0.1:3000/health/live; then
              exit 0
            fi
            sleep 5
          done
          docker compose --project-name bimer-api logs --tail=100
          exit 1
